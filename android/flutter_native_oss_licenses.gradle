import groovy.json.JsonOutput
import java.nio.ByteBuffer
import java.nio.charset.CodingErrorAction
import java.nio.charset.StandardCharsets
import org.gradle.api.DefaultTask
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.provider.Property
import org.gradle.api.tasks.CacheableTask
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.InputFile
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.TaskAction

@CacheableTask
abstract class FlutterNativeOssLicensesJsonTask extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getMetadataFile()

    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getLicenseBlobFile()

    @Input
    abstract Property<Boolean> getDebuggable()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void generate() {
        byte[] metadataBytes = metadataFile.get().asFile.bytes
        byte[] blob = licenseBlobFile.get().asFile.bytes
        String metadata = FlutterNativeOssLicensesJsonTask.decodeUtf8(
            metadataBytes,
            'license metadata',
        )
        List<Map<String, Object>> rows = []

        metadata.readLines().eachWithIndex { rawLine, index ->
            String line = rawLine.trim()
            if (line.isEmpty()) {
                return
            }

            def match = line =~ /^(\d+):(\d+)\s+(.+)$/
            if (!match.matches()) {
                throw new IllegalStateException(
                    "Malformed Google OSS license metadata at line ${index + 1}: ${rawLine}"
                )
            }

            long offset = Long.parseLong(match.group(1))
            long length = Long.parseLong(match.group(2))
            String packageName = match.group(3).trim()
            if (length <= 0 || packageName.isEmpty()) {
                throw new IllegalStateException(
                    "Invalid Google OSS license metadata at line ${index + 1}."
                )
            }
            if (offset < 0 || offset > blob.length || length > blob.length - offset) {
                throw new IllegalStateException(
                    "Google OSS license byte range is outside the generated blob at line ${index + 1}."
                )
            }

            String text = FlutterNativeOssLicensesJsonTask.decodeUtf8(
                Arrays.copyOfRange(blob, Math.toIntExact(offset), Math.toIntExact(offset + length)),
                "license text at metadata line ${index + 1}",
            )
            if (text.trim().isEmpty()) {
                throw new IllegalStateException(
                    "Google OSS license text is empty at metadata line ${index + 1}."
                )
            }
            rows.add([packageName: packageName, text: text])
        }

        boolean debugPlaceholder = rows.size() == 1 &&
            rows[0].packageName == 'Debug License Info'
        if (debugPlaceholder) {
            if (!debuggable.get()) {
                throw new IllegalStateException(
                    'Google OSS Licenses produced its debug placeholder for a non-debuggable variant.'
                )
            }
            logger.warn(
                'Google OSS Licenses does not receive an AGP dependency report for this debug variant; ' +
                'the generated native payload is empty. Verify licenses with a release build.'
            )
            rows.clear()
        }

        if (rows.isEmpty() && !debuggable.get()) {
            throw new IllegalStateException(
                'Google OSS Licenses produced no usable records for this release variant.'
            )
        }

        Map<String, Set<String>> packagesByText = new LinkedHashMap<>()
        rows.each { row ->
            packagesByText
                .computeIfAbsent(row.text as String) { new TreeSet<String>() }
                .add(row.packageName as String)
        }

        List<Map<String, Object>> payload = packagesByText.collect { text, packages ->
            [packages: packages.toList(), text: text]
        }
        payload.sort { left, right ->
            int byPackage = (left.packages[0] ?: '') <=> (right.packages[0] ?: '')
            byPackage != 0 ? byPackage : (left.text as String) <=> (right.text as String)
        }

        File destination = outputDirectory.file(
            'flutter_native_oss_licenses/licenses.json'
        ).get().asFile
        destination.parentFile.mkdirs()
        destination.setText(JsonOutput.prettyPrint(JsonOutput.toJson(payload)) + '\n', 'UTF-8')
    }

    static String decodeUtf8(byte[] bytes, String description) {
        try {
            return StandardCharsets.UTF_8
                .newDecoder()
                .onMalformedInput(CodingErrorAction.REPORT)
                .onUnmappableCharacter(CodingErrorAction.REPORT)
                .decode(ByteBuffer.wrap(bytes))
                .toString()
        } catch (Exception error) {
            throw new IllegalStateException("Invalid UTF-8 in ${description}.", error)
        }
