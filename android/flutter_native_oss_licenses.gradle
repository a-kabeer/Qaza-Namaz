}

plugins.withId('com.google.android.gms.oss-licenses-plugin') {
    androidComponents.onVariants(androidComponents.selector().all()) { variant ->
        String capitalizedVariant = variant.name.substring(0, 1).toUpperCase(Locale.ROOT) +
            variant.name.substring(1)
        def googleTask = tasks.named("${variant.name}OssLicensesTask")
        def jsonTask = tasks.register(
            "generate${capitalizedVariant}FlutterNativeOssLicenses",
            FlutterNativeOssLicensesJsonTask,
        ) {
            metadataFile.set(googleTask.flatMap {
                it.generatedDirectory.file('raw/third_party_license_metadata')
            })
            licenseBlobFile.set(googleTask.flatMap {
                it.generatedDirectory.file('raw/third_party_licenses')
            })
            debuggable.set(variant.debuggable)
            outputDirectory.set(
                layout.buildDirectory.dir(
                    "generated/flutter_native_oss_licenses/${variant.name}/assets"
                )
            )
        }
        variant.sources.assets.addGeneratedSourceDirectory(
            jsonTask,
            FlutterNativeOssLicensesJsonTask::getOutputDirectory,
        )
    }
}
