plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    // No Kotlin Gradle Plugin: `android.builtInKotlin=true` means AGP 9
    // compiles this module's Kotlin itself.
    // The Flutter Gradle Plugin must be applied after the Android plugin.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(localPropertiesFile.newReader("UTF-8"))
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// Release signing material. `android/key.properties` is git-ignored and is
// never committed; see android/key.properties.example for the expected keys.
// When it is absent — CI, a fresh clone, any contributor without the keystore —
// the release build falls back to the debug key so the build still succeeds,
// but the resulting APK is not distributable.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(keystorePropertiesFile.newReader("UTF-8"))
}

android {
    namespace = "com.example.qaza_namaz_task1_flutter"
    compileSdk = flutter.compileSdkVersion
    // Use the locally installed NDK (r28) instead of auto-installing r27.
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/projects/installing#application-id).
        applicationId = "com.example.qaza_namaz_task1_flutter"
        // Firebase Authentication requires Android API 23 or higher.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig = signingConfigs.release
            } else {
                throw new GradleException(
                    "Release signing is not configured. Provide android/key.properties " +
                    "and the production keystore; refusing to sign a release APK " +
                    "with the debug key."
                )
            }
        }
    }
}

// Built-in Kotlin configures itself through the top-level `kotlin` extension
// AGP registers, not through a block inside `android`. It has to agree with
// `compileOptions` above or AGP rejects the mismatch.
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

flutter {
    source = "../.."
}
