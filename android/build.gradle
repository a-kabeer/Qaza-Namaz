allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Gradle 9 removed the `buildDir` setter; the build directory is configured
// through the layout instead.
rootProject.layout.buildDirectory = rootProject.file("../build")
subprojects {
    project.layout.buildDirectory =
        rootProject.file("../build/${project.name}")
}

subprojects {
    project.evaluationDependsOn(":app")
}

// AGP 8.11+ wires JavaCompile compatibility from `android.compileOptions`
// during each subproject's own evaluation, which overrides rules registered
// earlier from the root project. Enforce JVM target 11 for every Android
// plugin module after all projects are evaluated (but before any task runs)
// so the Java and Kotlin tasks always agree on the same JVM target.
gradle.projectsEvaluated {
    subprojects.each { sub ->
        sub.plugins.withId("org.jetbrains.kotlin.android") {
            sub.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                // `kotlinOptions` is gone in Kotlin 2.3; the same setting
                // lives on `compilerOptions` now.
                compilerOptions {
                    jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
                }
            }
        }

        if (sub.extensions.findByName("android") != null) {
            sub.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_11
                targetCompatibility JavaVersion.VERSION_11
            }
        }

        sub.tasks.withType(JavaCompile).configureEach {
            sourceCompatibility = JavaVersion.VERSION_11.toString()
            targetCompatibility = JavaVersion.VERSION_11.toString()
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
