allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Gradle 9 removed the `buildDir` setter; the build directory is configured
// through the layout instead.
rootProject.layout.buildDirectory = rootProject.file("../build")
subprojects {
    project.layout.buildDirectory =
        rootProject.file("../build/${project.name}")
}

subprojects {
    project.evaluationDependsOn(":app")
}

// AGP 8.11+ wires JavaCompile compatibility from `android.compileOptions`
// during each subproject's own evaluation, which overrides rules registered
// earlier from the root project. Enforce JVM target 17 for every Android
// plugin module after all projects are evaluated (but before any task runs)
// so the Java and Kotlin tasks always agree on the same JVM target.
//
// 17 rather than 11 because that is what plugins built for AGP 9 compile at,
// and because built-in Kotlin takes its own target from `compileOptions`.
gradle.projectsEvaluated {
    subprojects.each { sub ->
        // Covers both ways a module's Kotlin can be compiled: its own Kotlin
        // Gradle Plugin, and AGP's built-in Kotlin, which uses the same task
        // type. `kotlinOptions` is gone in Kotlin 2.3; the same setting lives
        // on `compilerOptions` now.
        sub.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            compilerOptions {
                jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
            }
        }

        if (sub.extensions.findByName("android") != null) {
            sub.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        sub.tasks.withType(JavaCompile).configureEach {
            sourceCompatibility = JavaVersion.VERSION_17.toString()
            targetCompatibility = JavaVersion.VERSION_17.toString()
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
