org.gradle.jvmargs=-Xms128m -Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

org.gradle.workers.max=1
# Keep local Windows release builds within a predictable memory envelope.
# AGP 9 + Flutter do not require a 4 GiB daemon for this app, while limiting
# workers reduces peak native/JVM memory pressure that can kill the daemon.
android.useAndroidX=true
android.enableJetifier=false
# AGP 9 compiles Kotlin itself. The Flutter migrator turned this off because
# plugins that apply the Kotlin Gradle Plugin themselves conflict with it;
# every plugin this app depends on has since stopped doing so.
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Kotlin incremental compilation cannot safely persist plugin paths when the Pub cache and project are on different Windows drives.
kotlin.incremental=false

# Limit parallel worker processes to keep peak JVM/native memory predictable.
org.gradle.workers.max=2
