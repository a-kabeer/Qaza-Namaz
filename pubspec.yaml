name: qaza_namaz
description: Qaza Namaz ledger with offline-first local Drift/SQLite storage.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^1.2.0
  flex_color_scheme: ^9.0.0
  calendar_date_picker2: ^3.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  hijri: ^3.0.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3: ^3.5.2
  flutter_secure_storage: ^10.3.4
  path_provider: ^2.1.5
  shared_preferences: ^2.2.3
  flutter_riverpod: ^2.5.1
  file_picker: 13.1.0

  timezone: ^0.11.1
  adhan_dart: ^2.0.1
  geolocator: ^14.1.1
  flutter_timezone: ^5.1.0
  geonames_offline: ^0.1.0
  flutter_device_compass: ^2.2.0
  geomag: ^0.3.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  firebase_app_check: ^0.4.8
  connectivity_plus: ^7.3.1
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/knowledge_base/content/qaza_masail_mugalat_en.json
    - assets/knowledge_base/content/qaza_masail_mugalat_ur.json
    - assets/data/geonames_cities15000.tsv
  fonts:
    # Noto Nastaliq Urdu, SIL Open Font License 1.1 (assets/fonts/OFL.txt).
    # A single variable file covering wght 400-700; the theme selects a weight
    # with FontVariation rather than shipping four static cuts.
    - family: Noto Nastaliq Urdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-VariableFont_wght.ttf
