name: qaza_namaz
description: Qaza Namaz ledger with offline-first Drift/SQLite storage and optional Firebase cloud synchronization.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.7.0
  firebase_core: ^3.0.0
  google_sign_in: ^6.2.2
  hijri: ^3.0.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.5
  flutter_riverpod: ^2.5.1
  file_picker: ^10.3.10
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^3.0.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/knowledge_base/content/articles.json
