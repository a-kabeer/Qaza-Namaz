name: qaza_namaz
description: Qaza Namaz ledger with Firebase Authentication and Cloud Firestore persistence.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.7.0
  firebase_core: ^3.0.0
  google_sign_in: ^6.2.2
  hijri: ^3.0.1
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.5
  flutter_riverpod: ^2.5.1
  # Native Android-compatible JSON file open/save dialogs for Task 3I.
  file_picker: ^10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
