name: qaza_namaz
description: Qaza Namaz ledger with Firebase Authentication and Cloud Firestore persistence.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.7.0
  firebase_core: ^3.0.0
  google_sign_in: ^6.2.2
  # Hijri (Islamic/Umm al-Qura) Gregorian <-> Hijri date conversion.
  # Pure-Dart, no native code. Supported lookup range: 1356-1500 AH
  # (14 Mar 1937 - 16 Nov 2077 CE), which fully covers the app's
  # selectable firstDate (1950) through today.
  hijri: ^3.0.1
  # Task 3H offline-first persistence: local JSON cache per Firebase UID.
  shared_preferences: ^2.2.3
  # Task 3H sync trigger: flush the offline queue when connectivity returns.
  connectivity_plus: ^6.0.5
  # Centralized, testable application state. Screens read repositories,
  # services and session data from providers instead of receiving them through
  # widget constructors, which removes the manual dependency threading that
  # every screen previously had to repeat.
  flutter_riverpod: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true