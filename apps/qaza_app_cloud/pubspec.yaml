name: qaza_namaz_cloud
description: Google Sign-In and local-only host for Qaza Namaz.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  qaza_namaz:
    path: ../..
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift: ^2.35.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/qaza_namaz_logo.png

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
