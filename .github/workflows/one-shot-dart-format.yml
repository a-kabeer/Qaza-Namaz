name: One-shot Dart formatting

on:
  push:
    branches:
      - feat/pure-offline-backup-revision

jobs:
  format:
    if: github.event.head_commit.message != 'chore: apply CI Dart formatting'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: |
          dart format             lib/app/providers.dart             lib/core/diagnostics/diagnostics.dart             lib/data/data_transfer/local_backup_service.dart             lib/domain/entities/user_profile.dart             lib/domain/services/qaza_undo_service.dart             lib/features/home/providers/home_providers.dart             lib/features/prayer_time/application/prayer_time_providers.dart             lib/features/prayer_time/data/prayer_time_cache.dart             test/core/app_snackbar_test.dart             test/domain/profile_settings_pagination_regression_test.dart             test/features/prayer_time/prayer_location_setup_test.dart

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add             lib/app/providers.dart             lib/core/diagnostics/diagnostics.dart             lib/data/data_transfer/local_backup_service.dart             lib/domain/entities/user_profile.dart             lib/domain/services/qaza_undo_service.dart             lib/features/home/providers/home_providers.dart             lib/features/prayer_time/application/prayer_time_providers.dart             lib/features/prayer_time/data/prayer_time_cache.dart             test/core/app_snackbar_test.dart             test/domain/profile_settings_pagination_regression_test.dart             test/features/prayer_time/prayer_location_setup_test.dart
          git commit -m "chore: apply CI Dart formatting"
          git push
