name: Supabase PowerSync POC-0 (read-only)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'poc/supabase_powersync/**'
      - '.github/workflows/supabase-powersync-poc0.yml'

permissions:
  contents: read

concurrency:
  group: supabase-powersync-poc0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Toolchain, dependencies, licenses, and production boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCTION_CHECKOUT: ${{ github.workspace }}/production-checkout
      POC_CHECKOUT: ${{ github.workspace }}/poc-checkout
      POC_DIR: ${{ github.workspace }}/poc-checkout/poc/supabase_powersync
      POC_REL: poc/supabase_powersync
      EVIDENCE_DIR: ${{ github.workspace }}/poc0-evidence

    steps:
      - name: Create evidence directory
        shell: bash
        run: mkdir -p "$EVIDENCE_DIR"

      - name: Checkout clean production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-checkout
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout isolated PoC branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: poc-checkout
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Set up Node for Supabase CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: '2.122.0'

      - name: Record environment versions and source SHAs
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "POC-0 environment evidence"
            echo "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Event: $GITHUB_EVENT_NAME"
            echo "Workflow event SHA: $GITHUB_SHA"
            echo "PoC checkout SHA: $(git -C "$POC_CHECKOUT" rev-parse HEAD)"
            echo "Clean production main SHA: $(git -C "$PRODUCTION_CHECKOUT" rev-parse HEAD)"
            echo
            echo "### Flutter"
            flutter --version
            echo
            echo "### Dart"
            dart --version
            echo
            echo "### Java"
            java -version 2>&1
            echo
            echo "### Node/npm"
            node --version
            npm --version
            echo
            echo "### Docker client and daemon"
            docker version
            echo
            echo "### Docker Compose"
            docker compose version
            echo
            echo "### Supabase CLI"
            supabase --version
          } 2>&1 | tee "$EVIDENCE_DIR/toolchain.txt"
          {
            echo "### POC-0 environment"
            echo
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- PoC checkout SHA: $(git -C "$POC_CHECKOUT" rev-parse HEAD)"
            echo "- Clean production main SHA: $(git -C "$PRODUCTION_CHECKOUT" rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production-source boundary is unchanged
        shell: bash
        run: |
          set -euo pipefail
          cd "$POC_CHECKOUT"
          git diff --exit-code origin/main...HEAD -- AGENTS.md lib android apps packages pubspec.yaml pubspec.lock tools
          echo "PASS: no changes to production source, root manifests/lockfiles, or architecture tools." | tee "$EVIDENCE_DIR/production-boundary.txt"

      - name: Run unchanged architecture checks on clean production main
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRODUCTION_CHECKOUT"
          {
            echo "Clean production main SHA: $(git rev-parse HEAD)"
            python3 --version
            echo
            echo '$ python3 tools/offline_architecture_check.py'
            python3 tools/offline_architecture_check.py
            echo
            echo '$ python3 tools/phase_boundary_check.py'
            python3 tools/phase_boundary_check.py
          } 2>&1 | tee "$EVIDENCE_DIR/architecture-checks.txt"

      - name: Compile POC-0 helper scripts without writing formatted sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$POC_DIR"
          python3 -m py_compile scripts/check_pinned_versions.py scripts/license_inventory.py
          echo "PASS: Python helper scripts compile. No write-capable formatter/commit/push step is present." | tee "$EVIDENCE_DIR/helper-checks.txt"

      - name: Resolve isolated PoC dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$POC_DIR"
          if git -C "$POC_CHECKOUT" ls-files --error-unmatch "$POC_REL/pubspec.lock" >/dev/null 2>&1; then
            echo "Using checked-in PoC lockfile with enforce-lockfile." | tee "$EVIDENCE_DIR/dependency-resolution.txt"
            flutter pub get --enforce-lockfile 2>&1 | tee -a "$EVIDENCE_DIR/dependency-resolution.txt"
            git -C "$POC_CHECKOUT" diff --exit-code -- "$POC_REL/pubspec.lock"
          else
            echo "BOOTSTRAP: no PoC lockfile is checked in yet; generating a first resolved lockfile." | tee "$EVIDENCE_DIR/dependency-resolution.txt"
            flutter pub get 2>&1 | tee -a "$EVIDENCE_DIR/dependency-resolution.txt"
            echo "POC-0 remains incomplete until the generated lockfile is committed and a second run passes --enforce-lockfile." | tee -a "$EVIDENCE_DIR/dependency-resolution.txt"
          fi
          dart pub deps --style=compact 2>&1 | tee "$EVIDENCE_DIR/dependency-tree.txt"
          dart pub deps --json > "$EVIDENCE_DIR/pub-deps.json"
          python3 scripts/check_pinned_versions.py 2>&1 | tee "$EVIDENCE_DIR/pinned-versions.txt"
          python3 scripts/license_inventory.py --config .dart_tool/package_config.json --output "$EVIDENCE_DIR/license-inventory.md" > "$EVIDENCE_DIR/license-inventory-console.txt"
          cp pubspec.lock "$EVIDENCE_DIR/resolved-pubspec.lock"
          cp .dart_tool/package_config.json "$EVIDENCE_DIR/package-config.json"
          cat "$EVIDENCE_DIR/pinned-versions.txt"
          tail -n 5 "$EVIDENCE_DIR/license-inventory-console.txt"

      - name: Run encrypted PowerSync database smoke tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$POC_DIR"
          flutter test test/powersync_encryption_test.dart --reporter expanded 2>&1 | tee "$EVIDENCE_DIR/powersync-encryption-tests.txt"

      - name: Generate isolated Drift adapter code
        shell: bash
        run: |
          set -euo pipefail
          cd "$POC_DIR"
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee "$EVIDENCE_DIR/drift-codegen.txt"

      - name: Run PowerSync encryption and Drift adapter smoke tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$POC_DIR"
          flutter test test/powersync_encryption_test.dart test/drift_powersync_adapter_test.dart --reporter expanded 2>&1 | tee "$EVIDENCE_DIR/powersync-drift-tests.txt"

      - name: Upload POC-0 preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-powersync-poc0-evidence-${{ github.run_id }}-preflight
          path: ${{ github.workspace }}/poc0-evidence/
          if-no-files-found: warn
          retention-days: 14

  android_smoke:
    name: Android encrypted PowerSync runtime and release-build smoke test
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      POC_DIR: ${{ github.workspace }}/poc-checkout/poc/supabase_powersync
      EVIDENCE_DIR: ${{ github.workspace }}/poc0-evidence

    steps:
      - name: Create evidence directory
        shell: bash
        run: mkdir -p "$EVIDENCE_DIR"

      - name: Checkout isolated PoC commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: poc-checkout
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Download POC-0 preflight evidence
        uses: actions/download-artifact@v4
        with:
          name: supabase-powersync-poc0-evidence-${{ github.run_id }}-preflight
          path: ${{ github.workspace }}/poc0-evidence/

      - name: Prepare disposable Android smoke project
        shell: bash
        run: |
          set -euo pipefail
          python3 "$POC_DIR/scripts/prepare_android_smoke.py" "$RUNNER_TEMP/powersync-android-smoke"

      - name: Run Android encrypted runtime and release-build smoke test
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash "$POC_DIR/scripts/run_android_smoke.sh" "$RUNNER_TEMP/powersync-android-smoke" "$EVIDENCE_DIR"

      - name: Upload POC-0 Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-powersync-poc0-evidence-${{ github.run_id }}-android
          path: ${{ github.workspace }}/poc0-evidence/
          if-no-files-found: warn
          retention-days: 14
