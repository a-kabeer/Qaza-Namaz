name: Supabase PowerSync POC-0 (read-only)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'poc/supabase_powersync/**'
      - '.github/workflows/supabase-powersync-poc0.yml'

permissions:
  contents: read

concurrency:
  group: supabase-powersync-poc0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Toolchain, dependencies, licenses, and production boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCTION_CHECKOUT: ${{ github.workspace }}/production-checkout
      POC_CHECKOUT: ${{ github.workspace }}/poc-checkout
      POC_DIR: ${{ github.workspace }}/poc-checkout/poc/supabase_powersync
      POC_REL: poc/supabase_powersync
      EVIDENCE_DIR: ${{ github.workspace }}/poc0-evidence

    steps:
      - name: Create evidence directory
        shell: bash
        run: mkdir -p "$EVIDENCE_DIR"

      - name: Checkout clean production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-checkout
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout isolated PoC branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: poc-checkout
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Set up Node for Supabase CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: '2.122.0'

      - name: Record environment versions and source SHAs
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "POC-0 environment evidence"
            echo "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Event: $GITHUB_EVENT_NAME"
            echo "Workflow event SHA: $GITHUB_SHA"
            echo "PoC checkout SHA: $(git -C "$POC_CHECKOUT" rev-parse HEAD)"
            echo "Clean production main SHA: $(git -C "$PRODUCTION_CHECKOUT" rev-parse HEAD)"
            echo
            echo "### Flutter"
            flutter --version
            echo
            echo "### Dart"
            dart --version
            echo
            echo "### Java"
            java -version 2>&1
            echo
            echo "### Node/npm"
            node --version
            npm --version
            echo
            echo "### Docker client and daemon"
            docker version
            echo
            echo "### Docker Compose"
            docker compose version
            echo
            echo "### Supabase CLI"
            supabase --version
          } 2>&1 | tee "$EVIDENCE_DIR/toolchain.txt"
          {
            echo "### POC-0 environment"
            echo
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- PoC checkout SHA: $(git -C "$POC_CHECKOUT" rev-parse HEAD)"
            echo "- Clean production main SHA: $(git -C "$PRODUCTION_CHECKOUT" rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production-source boundary is unchanged
        shell: bash
        run: |
          set -euo pipefail
          cd "$POC_CHECKOUT"
          git diff --exit-code origin/main...HEAD -- AGENTS.md lib android apps packages pubspec.yaml pubspec.lock tools
          echo "PASS: no changes to production source, root manifests/lockfiles, or architecture tools." | tee "$EVIDENCE_DIR/production-boundary.txt"

      - name: Run unchanged architecture checks on clean production main
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRODUCTION_CHECKOUT"
          {
            echo "Clean production main SHA: $(git rev-parse HEAD)"
            python3 --version
            echo
            echo '$ python3 tools/offline_architecture_check.py'
            python3 tools/offline_architecture_check.py
            echo
            echo '$ python3 tools/phase_boundary_check.py'
            python3 tools/phase_boundary_check.py
          } 2>&1 | tee "$EVIDENCE_DIR/architecture-checks.txt"

      - name: Compile POC-0 helper scripts without writing formatted sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$POC_DIR"
          python3 -m py_compile scripts/check_pinned_versions.py scripts/license_inventory.py
          echo "PASS: Python helper scripts compile. No write-capable formatter/commit/push step is present." | tee "$EVIDENCE_DIR/helper-checks.txt"

      - name: Resolve isolated PoC dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$POC_DIR"
          if git -C "$POC_CHECKOUT" ls-files --error-unmatch "$POC_REL/pubspec.lock" >/dev/null 2>&1; then
            echo "Using checked-in PoC lockfile with enforce-lockfile." | tee "$EVIDENCE_DIR/dependency-resolution.txt"
            flutter pub get --enforce-lockfile 2>&1 | tee -a "$EVIDENCE_DIR/dependency-resolution.txt"
            git -C "$POC_CHECKOUT" diff --exit-code -- "$POC_REL/pubspec.lock"
          else
            echo "BOOTSTRAP: no PoC lockfile is checked in yet; generating a first resolved lockfile." | tee "$EVIDENCE_DIR/dependency-resolution.txt"
            flutter pub get 2>&1 | tee -a "$EVIDENCE_DIR/dependency-resolution.txt"
            echo "POC-0 remains incomplete until the generated lockfile is committed and a second run passes --enforce-lockfile." | tee -a "$EVIDENCE_DIR/dependency-resolution.txt"
          fi
          dart pub deps --style=compact 2>&1 | tee "$EVIDENCE_DIR/dependency-tree.txt"
          dart pub deps --json > "$EVIDENCE_DIR/pub-deps.json"
          python3 scripts/check_pinned_versions.py 2>&1 | tee "$EVIDENCE_DIR/pinned-versions.txt"
          python3 scripts/license_inventory.py --config .dart_tool/package_config.json --output "$EVIDENCE_DIR/license-inventory.md" > "$EVIDENCE_DIR/license-inventory-console.txt"
          cp pubspec.lock "$EVIDENCE_DIR/resolved-pubspec.lock"
          cp .dart_tool/package_config.json "$EVIDENCE_DIR/package-config.json"
          cat "$EVIDENCE_DIR/pinned-versions.txt"
          tail -n 5 "$EVIDENCE_DIR/license-inventory-console.txt"

      - name: Run encrypted PowerSync database smoke tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$POC_DIR"
          flutter test test/powersync_encryption_test.dart --reporter expanded 2>&1 | tee "$EVIDENCE_DIR/powersync-encryption-tests.txt"

      - name: Generate isolated Drift adapter code
        shell: bash
        run: |
          set -euo pipefail
          cd "$POC_DIR"
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee "$EVIDENCE_DIR/drift-codegen.txt"

      - name: Run PowerSync encryption and Drift adapter smoke tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$POC_DIR"
          flutter test test/powersync_encryption_test.dart test/drift_powersync_adapter_test.dart --reporter expanded 2>&1 | tee "$EVIDENCE_DIR/powersync-drift-tests.txt"

      - name: Android encrypted PowerSync runtime and release-build smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            ANDROID_APP="$RUNNER_TEMP/powersync-android-smoke"
            flutter create --platforms=android --project-name qaza_powersync_android_smoke "$ANDROID_APP"
            python3 - "$ANDROID_APP/pubspec.yaml" <<'PY'
            from pathlib import Path
            import sys

            path = Path(sys.argv[1])
            text = path.read_text(encoding="utf-8")
            if "  powersync: 2.5.0" not in text:
                text = text.replace(
                    "dependencies:\n",
                    "dependencies:\n  powersync: 2.5.0\n  path_provider: ^2.1.5\n",
                    1,
                )
            if "  integration_test:\n    sdk: flutter" not in text:
                text = text.replace(
                    "dev_dependencies:\n",
                    "dev_dependencies:\n  integration_test:\n    sdk: flutter\n",
                    1,
                )
            if "\nhooks:\n" not in text:
                text += "\nhooks:\n  user_defines:\n    sqlite3:\n      source: sqlite3mc\n"
            path.write_text(text, encoding="utf-8")
            PY
            mkdir -p "$ANDROID_APP/integration_test"
            cat > "$ANDROID_APP/lib/main.dart" <<'DART'
            import 'package:flutter/material.dart';

            void main() => runApp(const MaterialApp(home: Scaffold(body: Text('PowerSync encryption PoC'))));
            DART
            cat > "$ANDROID_APP/integration_test/powersync_encryption_test.dart" <<'DART'
            import 'dart:convert';
            import 'dart:io';

            import 'package:flutter_test/flutter_test.dart';
            import 'package:integration_test/integration_test.dart';
            import 'package:path_provider/path_provider.dart';
            import 'package:powersync/powersync.dart';

            const schema = Schema([
              Table('android_smoke_records', [Column.text('label')]),
            ]);

            String keyFor(int seed) =>
                base64UrlEncode(List<int>.generate(32, (i) => (i + seed) & 0xff));

            PowerSyncDatabase openDb(String path, {String? key}) => PowerSyncDatabase(
                  schema: schema,
                  path: path,
                  encryption: key == null
                      ? null
                      : EncryptionOptions(key: key, sqlcipherCompatibility: false),
                );

            Future<Object?> tryOpen(String path, {String? key}) async {
              PowerSyncDatabase? db;
              try {
                db = openDb(path, key: key);
                await db.initialize();
                await db.get('SELECT label FROM android_smoke_records LIMIT 1');
                return null;
              } catch (error) {
                return error;
              } finally {
                try {
                  if (db != null && !db.closed) await db.close();
                } catch (_) {}
              }
            }

            void main() {
              IntegrationTestWidgetsFlutterBinding.ensureInitialized();

              testWidgets('Android encrypted database persists and rejects wrong keys', (tester) async {
                final dir = await getApplicationSupportDirectory();
                final path = '${dir.path}${Platform.pathSeparator}powersync-${DateTime.now().microsecondsSinceEpoch}.sqlite';
                final key = keyFor(0);

                final db = openDb(path, key: key);
                await db.initialize();
                expect((await db.getUploadQueueStats()).count, 0);
                await db.execute(
                  'INSERT INTO android_smoke_records (id, label) VALUES (?, ?)',
                  ['android-record-1', 'synthetic-android-encrypted-record'],
                );
                expect((await db.getUploadQueueStats()).count, 1);
                await db.close();

                final file = File(path);
                final original = await file.readAsBytes();
                expect(original, isNotEmpty);
                expect(
                  String.fromCharCodes(original.take(16)),
                  isNot('SQLite format 3\u0000'),
                  reason: 'Encrypted SQLite file must not have the plaintext header.',
                );

                final reopened = openDb(path, key: key);
                await reopened.initialize();
                expect((await reopened.getUploadQueueStats()).count, 1);
                final row = await reopened.get(
                  'SELECT label FROM android_smoke_records WHERE id = ?',
                  ['android-record-1'],
                );
                expect(row['label'], 'synthetic-android-encrypted-record');
                await reopened.close();

                final wrongCopy = await file.copy('$path.wrong-key-copy');
                final wrongBytes = await wrongCopy.readAsBytes();
                expect(await tryOpen(wrongCopy.path, key: keyFor(71)), isNotNull);
                expect(await wrongCopy.readAsBytes(), equals(wrongBytes));

                final noKeyCopy = await file.copy('$path.no-key-copy');
                final noKeyBytes = await noKeyCopy.readAsBytes();
                expect(await tryOpen(noKeyCopy.path), isNotNull);
                expect(await noKeyCopy.readAsBytes(), equals(noKeyBytes));
                expect(await file.readAsBytes(), equals(original));
              });
            }
            DART
            cd "$ANDROID_APP"
            if ! flutter pub get >"$EVIDENCE_DIR/android-pub-get.txt" 2>&1; then cat "$EVIDENCE_DIR/android-pub-get.txt"; exit 1; fi
            cat "$EVIDENCE_DIR/android-pub-get.txt"
            if ! flutter test integration_test/powersync_encryption_test.dart -d emulator-5554 --reporter expanded >"$EVIDENCE_DIR/android-encryption-test.txt" 2>&1; then cat "$EVIDENCE_DIR/android-encryption-test.txt"; exit 1; fi
            cat "$EVIDENCE_DIR/android-encryption-test.txt"
            if ! flutter build apk --release --target-platform android-arm64 >"$EVIDENCE_DIR/android-release-build.txt" 2>&1; then cat "$EVIDENCE_DIR/android-release-build.txt"; exit 1; fi
            stat --format='release_apk_bytes=%s' build/app/outputs/flutter-apk/app-release.apk >>"$EVIDENCE_DIR/android-release-build.txt"
            cat "$EVIDENCE_DIR/android-release-build.txt"

      - name: Upload POC-0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-powersync-poc0-evidence-${{ github.run_id }}
          path: ${{ github.workspace }}/poc0-evidence/
          if-no-files-found: warn
          retention-days: 14
