name: Temporary Dart Format Inspection v3

on:
  push:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Exact CI formatter command
        shell: bash
        run: |
          set +e
          file="test/features/account/google_firebase_auth_service_test.dart"
          dart format --output=none --set-exit-if-changed "$file"
          status=$?
          echo "FORMAT_EXIT=$status"
          echo "----- DIFF -----"
          git diff --no-ext-diff -- "$file"
          echo "----- END DIFF -----"
          echo "----- FILE -----"
          cat "$file"
          echo "----- END FILE -----"
          exit 0
