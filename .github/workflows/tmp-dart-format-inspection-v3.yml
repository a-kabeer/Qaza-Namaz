name: Temporary Dart Format Inspection v3

on:
  push:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Capture formatter output after code generation
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          file="test/features/account/google_firebase_auth_service_test.dart"
          dart format "$file"
          echo "----- FORMATTED FILE -----"
          cat "$file"
          echo "----- END FORMATTED FILE -----"
