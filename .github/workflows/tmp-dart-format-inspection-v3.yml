name: Temporary Dart Format Inspection v3

on:
  push:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Capture formatted production files
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart format lib/app/app.dart lib/data/remote/firebase_services.dart
          echo "===== APP ====="
          cat lib/app/app.dart
          echo "===== FIREBASE ====="
          cat lib/data/remote/firebase_services.dart
