name: Flutter CI

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - 'task/**'
      - 'refactor/**'
      - 'reconcile/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze, test, and offline architecture checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Offline architecture policy
        run: python3 tools/offline_architecture_check.py

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Apply Dart formatting
        shell: bash
        run: |
          set -euo pipefail
          target_ref="$GITHUB_HEAD_REF"
          if [ -z "$target_ref" ]; then
            target_ref="$GITHUB_REF_NAME"
          fi

          for attempt in 1 2 3; do
            git reset --hard HEAD
            git clean -fd
            git fetch --no-tags origin main "$target_ref"
            git checkout -B "$target_ref" "origin/$target_ref"

            mapfile -t files < <(
              git diff --name-only origin/main HEAD -- '*.dart' |
              while IFS= read -r file; do
                [ -f "$file" ] && printf '%s\n' "$file"
              done
            )

            if [ "${#files[@]}" -eq 0 ]; then
              echo "No changed Dart files to format."
              exit 0
            fi

            dart format "${files[@]}"

            if git diff --quiet -- "${files[@]}"; then
              echo "Changed Dart files are already formatted."
              exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${files[@]}"
            git commit -m "style: format offline conversion changes"

            if git push origin "HEAD:${target_ref}"; then
              echo "Formatting commit pushed successfully."
              exit 0
            fi

            echo "Formatting push raced with another run; retrying against latest remote."
          done

          echo "Unable to push formatting commit after 3 attempts."
          exit 1


      - name: Test with coverage
        run: flutter test --coverage

  build_android:
    name: Android release artifacts
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pub get
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Offline architecture policy
        run: python3 tools/offline_architecture_check.py

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Verify release does not request INTERNET
        shell: bash
        run: |
          set -euo pipefail
          if grep -R 'android.permission.INTERNET' build/app/intermediates/merged_manifests/release/ 2>/dev/null; then
            echo "Release merged manifest still requests INTERNET."
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
