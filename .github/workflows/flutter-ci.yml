name: Flutter CI

on:
  push:
    branches:
      - main
      - 'task/**'
      - 'reconcile/**'
  pull_request:
    branches:
      - main

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Flutter clean
        run: flutter clean
      - name: pub get
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Check formatting
        run: dart format lib
      - name: Show formatting diff
        shell: bash
        run: |
          git diff --no-color -- lib > /tmp/formatter.patch
          if [ -s /tmp/formatter.patch ]; then
            echo "Formatter changes detected:"
            cat /tmp/formatter.patch
          else
            echo "No formatter changes detected."
          fi
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build_android:
    name: Android debug and release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Flutter clean
        run: flutter clean
      - name: pub get
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build debug APK
        run: flutter build apk --debug

      # The identity of the artifact, read back out of the APK rather than
      # assumed from the project files. A debug APK signed with a certificate
      # Firebase does not know completes the Google account chooser and then
      # returns no ID token, which is indistinguishable, on the device, from
      # the app being broken.
      - name: Extract debug APK signing identity
        id: debug_identity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/android_signing_audit.py \
            --apk build/app/outputs/flutter-apk/app-debug.apk \
            --firebase-package com.example.qaza_namaz_task1_flutter \
            | tee debug-signing-identity.txt
          if grep -q 'Firebase SHA-1 match: YES' debug-signing-identity.txt; then
            echo "registered=true" >> "$GITHUB_OUTPUT"
          else
            echo "registered=false" >> "$GITHUB_OUTPUT"
          fi

      # A hosted runner generates a throwaway debug keystore on first use, so
      # its SHA-1 can never match a registered one. Supply the team's debug
      # keystore as ANDROID_DEBUG_KEYSTORE_BASE64 to make this a hard gate;
      # without it the identity is reported but cannot be judged.
      - name: Enforce debug certificate registration
        shell: bash
        env:
          DEBUG_KEYSTORE_SUPPLIED: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 != '' }}
          REGISTERED: ${{ steps.debug_identity.outputs.registered }}
        run: |
          set -euo pipefail
          if [ "$DEBUG_KEYSTORE_SUPPLIED" != "true" ]; then
            echo "::notice::Debug keystore not supplied; this runner's ephemeral debug certificate cannot be matched against Firebase."
            exit 0
          fi
          if [ "$REGISTERED" != "true" ]; then
            echo "::error::The debug signing certificate is not registered as an Android OAuth client in Firebase. Google Sign-In will fail on every debug install."
            exit 1
          fi
          echo "Debug signing certificate is registered in Firebase."

      - name: Upload debug signing identity
        uses: actions/upload-artifact@v4
        with:
          name: debug-signing-identity
          path: debug-signing-identity.txt

      - name: Audit Android OAuth configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          build_gradle = Path("android/app/build.gradle").read_text()
          match = re.search(r'applicationId\s*=\s*"([^"]+)"', build_gradle)
          if not match:
              raise SystemExit("Could not determine Android applicationId.")
          package_name = match.group(1)

          config = json.loads(Path("android/app/google-services.json").read_text())
          matching = None
          for client in config.get("client", []):
              android = client.get("client_info", {}).get("android_client_info", {})
              if android.get("package_name") == package_name:
                  matching = client
                  break

          if matching is None:
              raise SystemExit(f"No Firebase Android client is registered for {package_name}.")

          certificate_hashes = []
          for oauth in matching.get("oauth_client", []):
              android_info = oauth.get("android_info", {})
              if (
                  oauth.get("client_type") == 1
                  and android_info.get("package_name") == package_name
                  and android_info.get("certificate_hash")
              ):
                  certificate_hashes.append(android_info["certificate_hash"])

          if not certificate_hashes:
              raise SystemExit(
                  f"No Android OAuth SHA-1 certificate is configured for {package_name}."
              )

          print(f"Firebase Android OAuth configuration found for {package_name}.")
          print(f"Registered Android OAuth certificate count: {len(certificate_hashes)}")
          PY

      - name: Verify Android release policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          build_gradle = Path("android/app/build.gradle").read_text()
          target = re.search(r'targetSdk\s*=\s*(\d+)', build_gradle)
          if target is None:
              raise SystemExit("Could not determine targetSdk from android/app/build.gradle.")
          target_sdk = int(target.group(1))
          if target_sdk < 36:
              raise SystemExit(
                  f"targetSdk {target_sdk} is below the Android 16 / API 36 Play requirement."
              )
          if "signingConfig = signingConfigs.debug" in build_gradle:
              raise SystemExit("Release build must never use the debug signing configuration.")
          print(f"Android target SDK policy OK: {target_sdk}")
          print("Release signing policy OK: no debug signing fallback.")
          PY

      - name: Detect release signing
        id: release_signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Production release signing is not configured; release artifacts will be skipped."
          fi

      - name: Prepare release signing
        if: steps.release_signing.outputs.configured == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=../release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Audit production release signing identity
        if: steps.release_signing.outputs.configured == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 tools/android_signing_audit.py \
            --keystore android/release-keystore.jks \
            --alias "$ANDROID_KEY_ALIAS" \
            --store-password-env ANDROID_KEYSTORE_PASSWORD \
            --firebase-package com.example.qaza_namaz_task1_flutter

      - name: Build signed release APK
        if: steps.release_signing.outputs.configured == 'true'
        run: flutter build apk --release

      # Strict: a release APK whose certificate Firebase does not know ships
      # with Google Sign-In permanently broken for every user who installs it.
      - name: Audit signed release APK
        if: steps.release_signing.outputs.configured == 'true'
        run: |
          python3 tools/android_signing_audit.py \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --firebase-package com.example.qaza_namaz_task1_flutter \
            --require-firebase-match

      - name: Build release AAB
        if: steps.release_signing.outputs.configured == 'true'
        run: flutter build appbundle --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload signed release APK
        if: steps.release_signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-signed
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release AAB
        if: steps.release_signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
