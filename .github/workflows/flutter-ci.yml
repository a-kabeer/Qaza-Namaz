name: Flutter CI

on:
  push:
    branches:
      - main
      - 'task/**'
      - 'reconcile/**'
  pull_request:
    branches:
      - main

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Firebase Android configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("android/app/google-services.json")
          if not path.exists():
              raise SystemExit("android/app/google-services.json is missing.")
          data = json.loads(path.read_text())
          if data.get("project_info", {}).get("project_id") != "qaza-nmz":
              raise SystemExit("Unexpected Firebase project ID.")
          clients = data.get("client", [])
          expected_package = "com.example.qaza_namaz_task1_flutter"
          expected_app_id = "1:895430705174:android:1e8d352d65428a4a3c7537"
          matched = False
          for client in clients:
              info = client.get("client_info", {})
              android = info.get("android_client_info", {})
              if android.get("package_name") == expected_package:
                  if info.get("mobilesdk_app_id") != expected_app_id:
                      raise SystemExit("Task 1 Firebase Android App ID does not match.")
                  matched = True
                  break
          if not matched:
              raise SystemExit("Task 1 Firebase Android client is missing.")
          print("Firebase Android configuration matches Task 1.")
          PY

      - name: Flutter clean
        run: flutter clean
      - name: pub get
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Check formatting
        id: formatting
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          files=$(git diff --name-only "origin/$GITHUB_BASE_REF" HEAD -- '*.dart')
          if [ -z "$files" ]; then
            echo "No Dart files changed in this PR."
            exit 0
          fi

          rm -rf /tmp/formatted-dart
          mkdir -p /tmp/formatted-dart
          printf '%s\n' "$files" | while IFS= read -r file; do
            mkdir -p "/tmp/formatted-dart/$(dirname "$file")"
            dart format "$file"
            cp "$file" "/tmp/formatted-dart/$file"
          done

          if ! git diff --quiet -- "$files"; then
            echo "Changed Dart files are not formatted:"
            git diff --name-only -- "$files"
            git diff --no-color -- "$files"
            exit 1
          fi

      - name: Upload formatter output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatted-dart-files
          path: /tmp/formatted-dart

      - name: Test
        run: flutter test
      - name: Show formatting diff
        shell: bash
        run: |
          git diff --no-color -- lib test > /tmp/formatter.patch
          if [ -s /tmp/formatter.patch ]; then
            echo "Formatter changes detected:"
            cat /tmp/formatter.patch
          else
            echo "No formatter changes detected."
          fi
      - name: Cache Firebase Emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-auth-firestore
          restore-keys: |
            firebase-emulators-${{ runner.os }}-
          save-always: true

      - name: Firebase Auth and Firestore Emulator security tests
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools emulators:exec             --only auth,firestore             --project qaza-nmz             "npx --yes --package=firebase@12.19.0 node tools/firebase_emulator_security_test.mjs"

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build_android:
    name: Android debug and release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Flutter clean
        run: flutter clean
      - name: pub get
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify Android release policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          build_gradle = Path("android/app/build.gradle").read_text()
          target = re.search(r'targetSdk\s*=\s*(\d+)', build_gradle)
          if target is None:
              raise SystemExit("Could not determine targetSdk from android/app/build.gradle.")
          target_sdk = int(target.group(1))
          if target_sdk < 36:
              raise SystemExit(
                  f"targetSdk {target_sdk} is below the Android 16 / API 36 Play requirement."
              )
          if "signingConfig = signingConfigs.debug" in build_gradle:
              raise SystemExit("Release build must never use the debug signing configuration.")
          print(f"Android target SDK policy OK: {target_sdk}")
          print("Release signing policy OK: no debug signing fallback.")
          PY

      - name: Detect release signing
        id: release_signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No production release signing configured; CI will verify unsigned release artifacts."
          fi

      - name: Prepare release signing
        if: steps.release_signing.outputs.configured == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=../release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
