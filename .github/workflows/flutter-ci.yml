name: Flutter CI

on:
  push:
    branches:
      - main
      - 'task/**'
      - 'refactor/**'
      - 'reconcile/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze, test, and offline architecture checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Offline architecture policy
        run: python3 tools/offline_architecture_check.py

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Auto-format changed Dart files on branch pushes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git diff --name-only "${{ github.event.before }}" HEAD -- '*.dart' |
            while IFS= read -r file; do
              [ -f "$file" ] && printf '%s\\n' "$file"
            done
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Dart files to format."
            exit 0
          fi
          dart format "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            echo "Changed Dart files were already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "style: format changed Dart files"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Check Dart formatting
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF" "$GITHUB_HEAD_REF"
            diff_base="origin/$GITHUB_BASE_REF"
            diff_head="origin/$GITHUB_HEAD_REF"
          else
            diff_base="${{ github.event.before }}"
            diff_head="HEAD"
            if [ -z "$diff_base" ] || [ "$diff_base" = "0000000000000000000000000000000000000000" ]; then
              diff_base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            fi
          fi

          mapfile -t files < <(
            git diff --name-only "$diff_base" "$diff_head" -- '*.dart' |
            while IFS= read -r file; do
              [ -f "$file" ] && printf '%s\n' "$file"
            done
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Dart files to format-check."
            exit 0
          fi

          dart format --output=none --set-exit-if-changed "${files[@]}"

      - name: Test with coverage
        run: flutter test --coverage

  build_android:
    name: Android release artifacts
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pub get
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Offline architecture policy
        run: python3 tools/offline_architecture_check.py

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Verify release does not request INTERNET
        shell: bash
        run: |
          set -euo pipefail
          if grep -R 'android.permission.INTERNET' build/app/intermediates/merged_manifests/release/ 2>/dev/null; then
            echo "Release merged manifest still requests INTERNET."
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
