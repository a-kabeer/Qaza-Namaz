name: Flutter CI

on:
  push:
    branches:
      - main
      - 'task/**'
      - 'reconcile/**'
  pull_request:
    branches:
      - main

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Firebase Android configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("android/app/google-services.json")
          if not path.exists():
              raise SystemExit("android/app/google-services.json is missing.")
          data = json.loads(path.read_text())
          if data.get("project_info", {}).get("project_id") != "qaza-nmz":
              raise SystemExit("Unexpected Firebase project ID.")
          clients = data.get("client", [])
          expected_package = "com.qaza_namaz.com"
          expected_app_id = "1:895430705174:android:83eb9e77acad787f3c7537"
          matched = False
          for client in clients:
              info = client.get("client_info", {})
              android = info.get("android_client_info", {})
              if android.get("package_name") == expected_package:
                  if info.get("mobilesdk_app_id") != expected_app_id:
                      raise SystemExit("Task 1 Firebase Android App ID does not match.")
                  matched = True
                  break
          if not matched:
              raise SystemExit("Task 1 Firebase Android client is missing.")
          print("Firebase Android configuration matches Task 1.")
          PY

      - name: Flutter clean
        run: flutter clean
      - name: pub get
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Check formatting
        id: formatting
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
            diff_base="origin/$GITHUB_BASE_REF"
          else
            diff_base="${{ github.event.before }}"
            if [ -z "$diff_base" ] || [ "$diff_base" = "0000000000000000000000000000000000000000" ]; then
              diff_base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            fi
          fi
          files=$(git diff --name-only "$diff_base" HEAD -- '*.dart')
          if [ -z "$files" ]; then
            echo "No Dart files changed in this PR."
            exit 0
          fi

          rm -rf /tmp/formatted-dart
          mkdir -p /tmp/formatted-dart
          printf '%s\n' "$files" | while IFS= read -r file; do
            if [ ! -f "$file" ]; then
              echo "Skipping deleted Dart file: $file"
              continue
            fi
            mkdir -p "/tmp/formatted-dart/$(dirname "$file")"
            dart format "$file"
            cp "$file" "/tmp/formatted-dart/$file"
          done

          if ! git diff --quiet -- "$files"; then
            echo "Changed Dart files are not formatted:"
            git diff --name-only -- "$files"
            git diff --no-color -- "$files"
            exit 1
          fi

      - name: Upload formatter output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatted-dart-files
          path: /tmp/formatted-dart

      - name: Test
        run: flutter test
      - name: Test coverage
        run: flutter test --coverage
      - name: Show formatting diff
        shell: bash
        run: |
          git diff --no-color -- lib test > /tmp/formatter.patch
          if [ -s /tmp/formatter.patch ]; then
            echo "Formatter changes detected:"
            cat /tmp/formatter.patch
          else
            echo "No formatter changes detected."
          fi
      - name: Cache Firebase Emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-auth-firestore
          restore-keys: |
            firebase-emulators-${{ runner.os }}-
          save-always: true

      - name: Firebase Auth and Firestore Emulator security tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 5m npm install --no-save --package-lock=false firebase@12.19.0 @firebase/rules-unit-testing@5.0.2
          timeout 10m npx --yes firebase-tools emulators:exec             --only firestore             --project qaza-nmz             "node tools/firebase_emulator_security_test.mjs"
          timeout 10m npx --yes firebase-tools emulators:exec             --only firestore             --project qaza-nmz             "node test/firestore_rules_test.js"

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build_android:
    name: Android debug and release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Flutter clean
        run: flutter clean
      - name: pub get
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify Android release policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          build_gradle = Path("android/app/build.gradle").read_text()
          target = re.search(r'targetSdk\s*=\s*(\d+)', build_gradle)
          if target is None:
              raise SystemExit("Could not determine targetSdk from android/app/build.gradle.")
          target_sdk = int(target.group(1))
          if target_sdk < 36:
              raise SystemExit(
                  f"targetSdk {target_sdk} is below the Android 16 / API 36 Play requirement."
              )
          if "signingConfig = signingConfigs.debug" in build_gradle:
              raise SystemExit("Release build must never use the debug signing configuration.")
          print(f"Android target SDK policy OK: {target_sdk}")
          print("Release signing policy OK: no debug signing fallback.")
          PY

      - name: Detect release signing
        id: release_signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No production release signing configured; CI will verify unsigned release artifacts."
          fi

      - name: Prepare release signing
        if: steps.release_signing.outputs.configured == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Verify Firebase Android identity and App Check provider policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          service = Path("lib/data/remote/firebase_services.dart").read_text()
          build_gradle = Path("android/app/build.gradle").read_text()

          package_match = re.search(
              r"androidPackage\s*=\s*'([^']+)'", service
          )
          sha256_match = re.search(
              r"androidSha256\s*=\s*\n\s*'([^']+)'", service
          )
          app_id_match = re.search(
              r'applicationId\s*=\s*"([^"]+)"', build_gradle
          )
          if not package_match or not sha256_match or not app_id_match:
              raise SystemExit(
                  "Could not resolve the canonical Firebase Android identity."
              )

          firebase_package = package_match.group(1)
          firebase_sha256 = sha256_match.group(1).replace(":", "").upper()
          application_id = app_id_match.group(1).strip()

          if application_id != firebase_package:
              raise SystemExit(
                  f"Android applicationId {application_id} does not match "
                  f"Firebase package {firebase_package}."
              )

          normalized = "".join(service.split())
          expected = (
              "providerAndroid:kReleaseMode"
              "?constAndroidPlayIntegrityProvider()"
              ":constAndroidDebugProvider(),"
          )
          if expected not in normalized:
              raise SystemExit(
                  "Firebase App Check provider policy is not explicitly release-safe."
              )
          if service.count("AndroidDebugProvider") != 1:
              raise SystemExit(
                  "Unexpected AndroidDebugProvider usage; release must not use it."
              )

          print(f"Firebase Android package OK: {firebase_package}")
          print(f"Canonical Firebase SHA-256: {firebase_sha256}")
          print("Production App Check provider policy OK.")
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Verify release signature
        if: steps.release_signing.outputs.configured == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "${APKSIGNER}" ]; then
            echo "apksigner was not found in the Android SDK build-tools."
            exit 1
          fi

          KEYTOOL_OUTPUT=$(keytool -list -v             -keystore android/release-keystore.jks             -storepass "${ANDROID_KEYSTORE_PASSWORD}"             -alias "${ANDROID_KEY_ALIAS}")

          KEY_SHA1=$(printf '%s\n' "${KEYTOOL_OUTPUT}" |
            awk -F': ' '/^Certificate fingerprints:/,/^Signature algorithm name:/{if ($1 ~ /SHA1:/) print $2;}' |
            tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          KEY_SHA256=$(printf '%s\n' "${KEYTOOL_OUTPUT}" |
            awk -F': ' '/^Certificate fingerprints:/,/^Signature algorithm name:/{if ($1 ~ /SHA256:/) print $2;}' |
            tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')

          CERTS=$("${APKSIGNER}" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          APK_SHA1=$(printf '%s\n' "${CERTS}" |
            awk -F': ' '/Signer #1 certificate SHA-1 digest:/{print $2}' |
            tr -d '[:space:]' | tr '[:lower:]' | tr '[:upper:]')
          APK_SHA256=$(printf '%s\n' "${CERTS}" |
            awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2}' |
            tr -d '[:space:]' | tr '[:lower:]' | tr '[:upper:]')

          test -n "${KEY_SHA1}" && test -n "${KEY_SHA256}"
          test "${KEY_SHA1}" = "${APK_SHA1}"
          test "${KEY_SHA256}" = "${APK_SHA256}"

          FIREBASE_SHA256=$(python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path("lib/data/remote/firebase_services.dart").read_text()
          match = re.search(r"androidSha256\s*=\s*\n\s*'([^']+)'", source)
          if not match:
              raise SystemExit("Canonical Firebase SHA-256 is missing.")
          print(match.group(1).replace(":", "").upper())
          PY
          )
          test "${FIREBASE_SHA256}" = "${APK_SHA256}"

          APK_PACKAGE=$(python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path("android/app/build.gradle").read_text()
          match = re.search(r'applicationId\s*=\s*"([^"]+)"', source)
          if not match:
              raise SystemExit("Could not determine Android applicationId.")
          print(match.group(1))
          PY
          )

          FIREBASE_PACKAGE=$(python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path("lib/data/remote/firebase_services.dart").read_text()
          match = re.search(r"androidPackage\s*=\s*'([^']+)'", source)
          if not match:
              raise SystemExit("Canonical Firebase package is missing.")
          print(match.group(1))
          PY
          )

          test "${APK_PACKAGE}" = "${FIREBASE_PACKAGE}"

          echo "Release APK signature matches the configured release keystore and Firebase Android identity."
          echo "Package: ${APK_PACKAGE}"
          echo "SHA-1: ${APK_SHA1}"
          echo "SHA-256: ${APK_SHA256}"

      - name: Report release signing availability
        if: steps.release_signing.outputs.configured != 'true'
        shell: bash
        run: |
          echo "::warning::Production release signing secrets are not configured."
          echo "::warning::Release APK/AAB will be unsigned in this CI run; signature verification is enforced whenever production signing is configured."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
