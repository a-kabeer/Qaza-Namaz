name: Flutter CI

on:
  push:
    branches:
      - main
      - 'task/**'
      - 'refactor/**'
      - 'reconcile/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze, test, and offline architecture checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Offline architecture policy
        run: python3 tools/offline_architecture_check.py

      - name: Phase 1 to Phase 2 boundary policy
        run: python3 tools/phase_boundary_check.py

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Format all Dart sources on branch pushes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          if git diff --quiet -- lib test; then
            echo "All Dart sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: format Dart sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Check Dart formatting
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test

      - name: Test with coverage
        run: flutter test --coverage

  build_android:
    name: Android release artifacts
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pub get
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Offline architecture policy
        run: python3 tools/offline_architecture_check.py

      - name: Phase 1 to Phase 2 boundary policy
        run: python3 tools/phase_boundary_check.py

      - name: Build release APK
        run: flutter build apk --release

      - name: Build debug APK for offline integration test
        run: flutter build apk --debug

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Verify release does not request INTERNET
        shell: bash
        run: |
          set -euo pipefail
          if grep -R 'android.permission.INTERNET' build/app/intermediates/merged_manifests/release/ 2>/dev/null; then
            echo "Release merged manifest still requests INTERNET."
            exit 1
          fi

      - name: Upload debug APK for offline integration test
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  android_offline_smoke:
    name: Android offline startup smoke test
    needs: build_android
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Download debug APK for offline integration test
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: .

      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api35-pixel5-x86_64

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run offline Android smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb wait-for-device

            # Resolve the host-side test/driver dependencies before isolating
            # the emulator network. The APK itself was already built by the
            # previous job, so no Gradle/NDK build occurs here.
            flutter pub get

            # Put the emulator into airplane mode and verify that no Wi-Fi or
            # cellular transport remains active before starting the app.
            adb shell svc wifi disable
            adb shell svc data disable || true
            adb shell cmd connectivity airplane-mode enable || true
            adb shell settings put global airplane_mode_on 1
            adb shell settings put global wifi_on 0 || true
            adb shell dumpsys connectivity | tee connectivity-offline.txt
            if grep -E 'TRANSPORT_WIFI|TRANSPORT_CELLULAR' connectivity-offline.txt | grep -E 'CONNECTED|VALIDATED' >/dev/null; then
              echo "Emulator still has an active Wi-Fi/cellular transport."
              exit 1
            fi

            timeout 180s flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/offline_startup_test.dart \
              --use-application-binary=app-debug.apk \
              --device-id=emulator-5554 \
              --no-dds
