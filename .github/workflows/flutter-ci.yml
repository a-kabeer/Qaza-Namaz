name: Flutter CI

on:
  push:
    branches:
      - main
      - 'task*'
      - 'reconcile/**'
  pull_request:
    branches:
      - main

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Flutter clean
        run: flutter clean
      - name: pub get
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      # Runs after generation so the check covers the same tree Analyze sees,
      # generated sources included.
      - name: Check formatting
        run: dart format lib test
      - name: Show formatting diff
        shell: bash
        run: |
          git diff --no-color -- lib test > /tmp/formatter.patch
          if [ -s /tmp/formatter.patch ]; then
            echo "Formatter changes detected:"
            cat /tmp/formatter.patch
          else
            echo "No formatter changes detected."
          fi
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Flutter clean
        run: flutter clean
      - name: pub get
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Run tests
        run: flutter test --reporter expanded

  test_windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Flutter clean
        run: flutter clean
      - name: pub get
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Run tests
        run: flutter test --reporter expanded

  build_android:
    name: Android debug and release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Flutter clean
        run: flutter clean
      - name: pub get
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Audit Android OAuth configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          build_gradle = Path("android/app/build.gradle").read_text()
          match = re.search(r'applicationId\s*=\s*"([^"]+)"', build_gradle)
          if not match:
              raise SystemExit("Could not determine Android applicationId.")
          package_name = match.group(1)

          config = json.loads(Path("android/app/google-services.json").read_text())
          matching = None
          for client in config.get("client", []):
              info = client.get("client_info", {})
              android = info.get("android_client_info", {})
              if android.get("package_name") == package_name:
                  matching = client
                  break

          if matching is None:
              raise SystemExit(
                  f"No Firebase Android client is registered for {package_name}."
              )

          android_oauth = []
          for oauth in matching.get("oauth_client", []):
              android_info = oauth.get("android_info", {})
              if (
                  oauth.get("client_type") == 1
                  and android_info.get("package_name") == package_name
              ):
                  android_oauth.append(android_info)

          if not android_oauth:
              raise SystemExit(
                  f"No Android OAuth client is registered for {package_name}."
              )

          certificate_hashes = [
              item.get("certificate_hash")
              for item in android_oauth
              if item.get("certificate_hash")
          ]
          if not certificate_hashes:
              raise SystemExit(
                  f"No Android OAuth SHA-1 certificate is configured for {package_name}."
              )

          print(f"Firebase Android OAuth configuration found for {package_name}.")
          print(f"Registered Android OAuth certificate count: {len(certificate_hashes)}")
          PY

      - name: Detect release signing
        id: release_signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Production release signing is not configured; release artifact will be skipped."
          fi

      - name: Prepare release signing
        if: steps.release_signing.outputs.configured == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=../release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build release APK
        if: steps.release_signing.outputs.configured == 'true'
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APK
        if: steps.release_signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
