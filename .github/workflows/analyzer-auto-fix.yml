name: Temporary Analyzer Fix

on:
  push:
    branches:
      - 'task/analyzer-cleanup'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[analyzer-fix-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply Dart fixes
        run: dart fix --apply
      - name: Format Dart
        run: dart format lib
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No automatic Dart fixes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib
          git commit -m "chore: apply analyzer fixes [analyzer-fix-bot]"
          git push origin HEAD:task/analyzer-cleanup
