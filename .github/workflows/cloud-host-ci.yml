name: Cloud Host CI

on:
  push:
    branches:
      - main
      - 'fix/**'
    paths:
      - 'packages/qaza_cloud_adapter/**'
      - 'apps/qaza_app_cloud/**'
      - 'docs/PHASE_2_CLOUD_ADAPTER.md'
      - '.github/workflows/cloud-host-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/qaza_cloud_adapter/**'
      - 'apps/qaza_app_cloud/**'
      - 'docs/PHASE_2_CLOUD_ADAPTER.md'
      - '.github/workflows/cloud-host-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-host-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    name: Analyze and test isolated cloud adapter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Resolve adapter dependencies
        working-directory: packages/qaza_cloud_adapter
        run: flutter pub get

      - name: Check adapter Dart formatting
        working-directory: packages/qaza_cloud_adapter
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze adapter
        working-directory: packages/qaza_cloud_adapter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test adapter
        working-directory: packages/qaza_cloud_adapter
        run: flutter test

  cloud_android:
    name: Build cloud-enabled Android host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve cloud host dependencies
        working-directory: apps/qaza_app_cloud
        run: flutter pub get

      - name: Analyze cloud host
        working-directory: apps/qaza_app_cloud
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build cloud-enabled debug APK
        working-directory: apps/qaza_app_cloud
        run: flutter build apk --debug --dart-define=GOOGLE_SERVER_CLIENT_ID=ci-placeholder
