name: Temporary auth verification

on:
  push:
    branches: [task-auth-format]

permissions:
  contents: write

jobs:
  verify-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: >
          dart format --set-exit-if-changed
          lib/data/auth/firebase_auth_repository.dart
          lib/data/auth/google_auth_flow.dart
          lib/features/auth/authentication_screen.dart
          lib/features/auth/guest_session.dart
          lib/features/auth/guest_upgrade_controller.dart
          test/auth_startup_google_test.dart
          test/google_auth_configuration_test.dart
          test/guest_migration_service_test.dart
          test/guest_upgrade_controller_test.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: >
          flutter test
          test/google_auth_flow_test.dart
          test/google_auth_configuration_test.dart
          test/auth_startup_google_test.dart
          test/guest_migration_service_test.dart
          test/guest_upgrade_controller_test.dart
