name: Temporary auth format

on:
  push:
    branches: [task-auth-format]

permissions:
  contents: write

jobs:
  format-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
      - run: flutter pub get
      - run: dart format lib/data/auth/firebase_auth_repository.dart lib/data/auth/google_auth_flow.dart lib/features/auth/authentication_screen.dart lib/features/auth/guest_session.dart lib/features/auth/guest_upgrade_controller.dart test/auth_startup_google_test.dart test/google_auth_configuration_test.dart test/guest_migration_service_test.dart test/guest_upgrade_controller_test.dart
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/auth/firebase_auth_repository.dart lib/data/auth/google_auth_flow.dart lib/features/auth/authentication_screen.dart lib/features/auth/guest_session.dart lib/features/auth/guest_upgrade_controller.dart test/auth_startup_google_test.dart test/google_auth_configuration_test.dart test/guest_migration_service_test.dart test/guest_upgrade_controller_test.dart
          git diff --cached --quiet || git commit -m "chore: format auth audit files"
          git push
