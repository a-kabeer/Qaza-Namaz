name: Cloud App CI

on:
  push:
    branches:
      - 'task/**'
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'apps/qaza_app_cloud/**'
      - 'packages/qaza_cloud_adapter/**'
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'tools/**'
      - '.github/workflows/cloud-app-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/qaza_app_cloud/**'
      - 'packages/qaza_cloud_adapter/**'
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'tools/**'
      - '.github/workflows/cloud-app-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Protect offline application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install offline dependencies
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Offline architecture policy
        run: python3 tools/offline_architecture_check.py
      - name: Dependency boundary policy
        run: python3 tools/phase_boundary_check.py
      - name: Analyze offline application
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test offline application
        run: flutter test --coverage

  cloud_host:
    name: Analyze and build cloud-enabled Android host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Install cloud host dependencies
        working-directory: apps/qaza_app_cloud
        run: flutter pub get
      - name: Format cloud host sources on branch pushes
        if: github.event_name == 'push'
        working-directory: apps/qaza_app_cloud
        shell: bash
        run: |
          set -euo pipefail
          dart format lib
          if git diff --quiet -- apps/qaza_app_cloud/lib; then
            echo "Cloud host Dart sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/qaza_app_cloud/lib
          git commit -m "style: format cloud host Dart sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Analyze cloud host
        working-directory: apps/qaza_app_cloud
        run: dart analyze
      - name: Check cloud host formatting
        working-directory: apps/qaza_app_cloud
        run: dart format --output=none --set-exit-if-changed lib
      - name: Install and test adapter package
        working-directory: packages/qaza_cloud_adapter
        run: |
          flutter pub get
          dart analyze
          dart format --output=none --set-exit-if-changed lib test
          flutter test
      - name: Build cloud-enabled Android APK
        working-directory: apps/qaza_app_cloud
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: flutter build apk --release --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
